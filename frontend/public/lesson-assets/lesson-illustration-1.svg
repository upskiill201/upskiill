<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Monitor body -->
  <rect x="12" y="10" width="56" height="40" rx="4" fill="#1F2A44"/>
  <!-- Screen -->
  <rect x="16" y="14" width="48" height="32" rx="2" fill="#3D5AFE"/>
  <!-- Screen gradient -->
  <rect x="16" y="14" width="48" height="32" rx="2" fill="url(#screenGrad1)"/>
  <!-- Screen content lines -->
  <rect x="22" y="22" width="24" height="3" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="22" y="28" width="18" height="3" rx="1.5" fill="white" opacity="0.5"/>
  <rect x="22" y="34" width="30" height="3" rx="1.5" fill="white" opacity="0.4"/>
  <!-- Play button -->
  <circle cx="40" cy="30" r="8" fill="white" opacity="0.2"/>
  <polygon points="38,26 38,34 45,30" fill="white" opacity="0.9"/>
  <!-- Stand -->
  <rect x="34" y="50" width="12" height="6" rx="1" fill="#334155"/>
  <!-- Base -->
  <ellipse cx="40" cy="58" rx="16" ry="4" fill="#475569"/>
  <!-- Reflection highlight -->
  <rect x="18" y="15" width="10" height="6" rx="1" fill="white" opacity="0.1"/>
  <defs>
    <linearGradient id="screenGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C8CFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3D5AFE" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
