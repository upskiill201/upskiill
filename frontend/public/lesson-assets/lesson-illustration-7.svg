<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Exhaust flames -->
  <ellipse cx="40" cy="74" rx="6" ry="8" fill="#F97316" opacity="0.6"/>
  <ellipse cx="40" cy="72" rx="4" ry="6" fill="#FBBF24" opacity="0.8"/>
  <ellipse cx="40" cy="70" rx="2" ry="4" fill="#FEF08A"/>
  <!-- Rocket body -->
  <path d="M30 54 L32 28 Q40 10, 48 28 L50 54 Z" fill="#E2E8F0"/>
  <path d="M32 54 L34 30 Q40 14, 46 30 L48 54 Z" fill="white"/>
  <!-- Window -->
  <circle cx="40" cy="34" r="6" fill="#3D5AFE"/>
  <circle cx="40" cy="34" r="6" fill="url(#rocketWindow)"/>
  <circle cx="38" cy="32" r="2" fill="white" opacity="0.4"/>
  <!-- Fins -->
  <path d="M30 54 L24 64 L32 58 Z" fill="#EF4444"/>
  <path d="M50 54 L56 64 L48 58 Z" fill="#EF4444"/>
  <!-- Nose cone accent -->
  <path d="M38 18 Q40 12, 42 18" stroke="#CBD5E1" stroke-width="1" fill="none"/>
  <!-- Speed lines -->
  <line x1="22" y1="40" x2="18" y2="44" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="40" x2="62" y2="44" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="48" x2="16" y2="52" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="48" x2="64" y2="52" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/>
  <!-- Stars -->
  <circle cx="16" cy="20" r="1.5" fill="#FBBF24"/>
  <circle cx="64" cy="16" r="1" fill="#FBBF24"/>
  <circle cx="68" cy="30" r="1.5" fill="#FBBF24" opacity="0.7"/>
  <defs>
    <radialGradient id="rocketWindow" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#6C8CFF"/>
      <stop offset="100%" stop-color="#3D5AFE"/>
    </radialGradient>
  </defs>
</svg>
