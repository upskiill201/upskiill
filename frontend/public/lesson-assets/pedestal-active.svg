<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <!-- Glow -->
  <ellipse cx="60" cy="96" rx="48" ry="7" fill="rgba(61,90,254,0.12)"/>
  <!-- Cylinder side -->
  <rect x="14" y="50" width="92" height="38" rx="4" fill="#2D4AEE"/>
  <!-- Cylinder front face bottom arc -->
  <ellipse cx="60" cy="88" rx="46" ry="9" fill="#1E3ADF"/>
  <!-- Cylinder top surface -->
  <ellipse cx="60" cy="50" rx="46" ry="15" fill="#6C8CFF"/>
  <!-- Top surface highlight -->
  <ellipse cx="60" cy="48" rx="36" ry="10" fill="#93AAFF" opacity="0.5"/>
  <!-- Inner glow ring -->
  <ellipse cx="60" cy="50" rx="28" ry="9" fill="#3D5AFE" opacity="0.7"/>
  <!-- Pulse ring -->
  <ellipse cx="60" cy="50" rx="46" ry="15" fill="none" stroke="#6C8CFF" stroke-width="2" opacity="0.4"/>
</svg>
