  <line x1="56" y1="12" x2="59" y2="9" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="12" x2="21" y2="9" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="26" x2="66" y2="25" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="26" x2="14" y2="25" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <defs>
    <radialGradient id="bulbGrad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </radialGradient>
