name: Deploy — Staging

# Runs automatically when a PR is merged into the staging branch.
# Applies any pending DB migrations, then triggers Render to deploy the staging backend.
# Vercel deploys the staging frontend automatically via its own GitHub integration.
on:
  push:
    branches:
      - staging
  # Manual re-run, e.g. to republish every Teyro Original on staging.
  workflow_dispatch:
    inputs:
      originals:
        description: 'Teyro Originals to publish: only the courses changed since the last successful deploy, or all of them'
        required: false
        type: choice
        default: changed
        options:
          - changed
          - all

jobs:
  deploy-staging-backend:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    permissions:
      actions: read     # find the last successful deploy (Publish Teyro Originals)
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the Originals loader can diff against the last deploy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply staging DB migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Trigger Render staging deploy
        # Render deploy hooks are a simple GET/POST to a URL.
        # Go to render.com → teyro-backend-staging → Settings → Deploy Hook → copy URL
        # Add it as RENDER_STAGING_DEPLOY_HOOK_URL in GitHub repo secrets.
        run: |
          curl -s "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}" \
            -X POST \
            -H "Content-Type: application/json" \
            --fail \
            --retry 3

      - name: Wait for staging to be healthy
        # Give Render 90 seconds to boot, then confirm the health endpoint responds.
        run: |
          sleep 90
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://upskiill-backend.onrender.com/health || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️  Staging backend health check returned $STATUS — check Render logs"
          else
            echo "✅ Staging backend is healthy"
          fi

      - name: Publish Teyro Originals
        # Course content ships with the deploy (the same step runs in
        # production), so nobody loads courses by hand. The loader checks every
        # lesson and runs its Python first, refuses to write if anything fails,
        # and is upsert-only: it never deletes (backend/scripts/originals.ts).
        # Like production (founder, 2026-11-03), it only rewrites the Tracks
        # changed since the last successful staging deploy; shared course code,
        # an unknown commit, no earlier success or the "all" input republish all.
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          GH_TOKEN: ${{ github.token }}
          ORIGINALS_INPUT: ${{ github.event.inputs.originals }}
        run: |
          SINCE=""
          if [ "$ORIGINALS_INPUT" != "all" ]; then
            SINCE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-staging.yml --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          fi
          if [ -n "$SINCE" ]; then
            echo "Publishing the Originals changed since the last successful deploy ($SINCE)."
            npm run originals -- --write --publish --changed-since "$SINCE"
          else
            echo "Publishing ALL Originals (input: ${ORIGINALS_INPUT:-changed}; no earlier successful deploy used)."
            npm run originals -- --write --publish
          fi
