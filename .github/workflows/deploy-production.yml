name: Deploy — Production

# MANUAL ONLY — you trigger this by clicking "Run workflow" in the GitHub Actions tab.
# Never runs automatically. This is the conscious gate before real users see a change.
#
# Before triggering:
# 1. Verify the feature works correctly on staging (teyro-git-staging.vercel.app)
# 2. Check Render staging logs — no errors
# 3. Then click Run workflow below

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm you have tested this on staging'
        required: true
        type: string
      originals:
        description: 'Teyro Originals to publish: only the courses changed since the last successful deploy, or all of them'
        required: false
        type: choice
        default: changed
        options:
          - changed
          - all

jobs:
  validate:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ You must type DEPLOY in the confirmation field. Aborting."
            exit 1
          fi
          echo "✅ Confirmation received. Proceeding to production deploy."

  deploy-production-backend:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    needs: validate
    environment: production   # requires approval from a GitHub Environment protection rule
    permissions:
      actions: read     # find the last successful deploy (Publish Teyro Originals)
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the Originals loader can diff against the last deploy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply production DB migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Trigger Render production deploy
        # Go to render.com → teyro-backend → Settings → Deploy Hook → copy URL
        # Add it as RENDER_PRODUCTION_DEPLOY_HOOK_URL in GitHub repo secrets.
        run: |
          curl -s "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}" \
            -X POST \
            -H "Content-Type: application/json" \
            --fail \
            --retry 3

      - name: Wait for production to be healthy
        run: |
          sleep 120
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://teyro-backend.onrender.com/health || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️  Production backend health check returned $STATUS — check Render logs immediately"
            exit 1
          else
            echo "✅ Production backend is healthy. teyro.app is live."
          fi

      - name: Publish Teyro Originals
        # Founder decision 2026-10-14: course content ships with the deploy, so
        # nobody runs the loader against production by hand. It runs only once
        # the new backend is healthy (the old one doesn't know about Originals).
        # The loader checks every lesson first, runs every lesson's Python, and
        # refuses to write if anything fails; it is upsert-only and never deletes
        # (backend/scripts/originals.ts).
        #
        # Founder decision 2026-11-03: publish only the courses being pushed (a
        # full run takes 30–60 minutes). The loader diffs against the commit of
        # the last successful production deploy and rewrites only the Tracks
        # whose files changed; a change to shared course code, an unknown commit,
        # no earlier successful deploy, or the "all" input republishes every
        # course, which is always safe because the loader never deletes.
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          GH_TOKEN: ${{ github.token }}
          ORIGINALS_INPUT: ${{ github.event.inputs.originals }}
        run: |
          SINCE=""
          if [ "$ORIGINALS_INPUT" != "all" ]; then
            SINCE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-production.yml --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          fi
          if [ -n "$SINCE" ]; then
            echo "Publishing the Originals changed since the last successful deploy ($SINCE)."
            npm run originals -- --write --publish --changed-since "$SINCE"
          else
            echo "Publishing ALL Originals (input: ${ORIGINALS_INPUT:-changed}; no earlier successful deploy used)."
            npm run originals -- --write --publish
          fi

      - name: Announce deploy
        run: |
          echo "🚀 Production deploy complete."
          echo "   Backend: https://teyro-backend.onrender.com"
          echo "   Frontend: https://teyro.app (Vercel auto-deployed from main)"
          echo "   Deployed by: ${{ github.actor }}"
          echo "   Commit: ${{ github.sha }}"
