<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet" />
<style>
  /* Teyro Originals cover: How to Give a Convincing Elevator Pitch. A still
     frame of a lift: the floor display racing to 32, a 0:60 stopwatch, and a
     one-sentence pitch bubble mid-air. No Tey. */
  :root {
    --brand: #0172FD;
    --brand-dark: #0060D9;
    --brand-deep: #0050B3;
    --ink: #071233;
    --amber: #F59E0B;
    --amber-dark: #B45309;
    --green: #22C55E;
    --green-dark: #16A34A;
    --pink: #EC4899;
    --pink-dark: #9D174D;
    --white: #FFFFFF;
    --mist: #E8F1FF;
    --steel: #1B2A4A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--brand); overflow: hidden; position: relative; }

  .blob { position: absolute; border-radius: 50%; background: var(--brand-dark); }
  .speed { position: absolute; height: 10px; border-radius: 999px; background: var(--white); transform: rotate(-18deg); transform-origin: left center; }
  .ring { position: absolute; border-radius: 50%; border: 6px solid var(--white); }

  .copy { position: absolute; left: 100px; top: 120px; width: 720px; z-index: 5; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--white); color: var(--brand);
    font-weight: 800; font-size: 26px; letter-spacing: .08em; text-transform: uppercase;
    padding: 14px 26px; border-radius: 999px; box-shadow: 0 6px 0 var(--brand-deep);
  }
  .pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--amber); display: inline-block; }
  h1 { margin-top: 38px; color: var(--white); font-weight: 800; font-size: 96px; line-height: 1.0; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: var(--ink); background: var(--amber); padding: 0 18px 6px; border-radius: 26px; box-shadow: 0 8px 0 var(--amber-dark); display: inline-block; margin: 10px 0 6px; }
  .sub { margin-top: 36px; color: var(--mist); font-weight: 700; font-size: 32px; line-height: 1.3; width: 600px; }

  .stage { position: absolute; left: 880px; top: 80px; width: 680px; height: 860px; transform: rotate(-3deg); }

  .floors { position: absolute; left: 40px; top: 20px; width: 600px; background: var(--steel); border-radius: 30px; padding: 22px 26px; display: flex; gap: 14px; justify-content: space-between; box-shadow: 0 12px 0 #0B1630; }
  .floors span { font-weight: 800; font-size: 40px; color: rgba(255,255,255,.28); width: 82px; height: 82px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid rgba(255,255,255,.16); }
  .floors span.on { color: var(--ink); background: var(--amber); border-color: var(--amber); box-shadow: 0 0 0 10px rgba(245,158,11,.25); }
  .arrow { position: absolute; left: 290px; top: 150px; width: 0; height: 0; border-left: 34px solid transparent; border-right: 34px solid transparent; border-bottom: 46px solid var(--white); opacity: .9; }

  .watch { position: absolute; left: 380px; top: 250px; width: 260px; height: 260px; border-radius: 50%; background: var(--white); box-shadow: 0 12px 0 var(--brand-deep); display: flex; align-items: center; justify-content: center; }
  .watch::before { content: ''; position: absolute; top: -34px; left: 105px; width: 50px; height: 34px; background: var(--white); border-radius: 10px 10px 0 0; }
  .watch .ring2 { position: absolute; inset: 18px; border-radius: 50%; border: 14px solid var(--mist); border-top-color: var(--green); border-right-color: var(--green); }
  .watch b { font-weight: 800; font-size: 74px; color: var(--ink); letter-spacing: -0.03em; position: relative; }

  .bubble { position: absolute; padding: 28px 34px; font-weight: 800; color: var(--ink); background: var(--white); box-shadow: 0 12px 0 var(--brand-deep); border-radius: 40px 40px 40px 10px; }
  .bubble .who { font-size: 22px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; color: var(--brand); }
  .bubble p { font-size: 38px; line-height: 1.14; }
  .b1 { left: 0; top: 560px; width: 520px; }
  .b2 { left: 330px; top: 760px; padding: 20px 28px; background: var(--green); color: var(--white); border-radius: 30px 30px 10px 30px; box-shadow: 0 10px 0 var(--green-dark); }
  .b2 p { font-size: 34px; }
  .ghost { opacity: .18; box-shadow: none !important; }
  .ghost * { visibility: hidden; }

  .chip { position: absolute; padding: 13px 22px; border-radius: 18px; font-weight: 800; font-size: 27px; color: var(--white); white-space: nowrap; background: var(--pink); box-shadow: 0 6px 0 var(--pink-dark); }
  .spark { position: absolute; }
</style>
</head>
<body>
  <div class="blob" style="width:820px;height:820px;right:-220px;top:-300px;opacity:.55"></div>
  <div class="blob" style="width:540px;height:540px;left:-220px;bottom:-280px;opacity:.45"></div>

  <div class="speed" style="left:-40px;top:930px;width:420px;opacity:.10"></div>
  <div class="speed" style="left:300px;top:960px;width:260px;opacity:.16"></div>
  <div class="speed" style="left:1400px;top:940px;width:220px;opacity:.12"></div>
  <div class="ring" style="width:150px;height:150px;left:740px;top:790px;opacity:.12"></div>
  <div class="ring" style="width:60px;height:60px;left:1520px;top:40px;opacity:.25"></div>

  <div class="copy">
    <span class="pill"><i></i>Teyro Original · Short course</span>
    <h1>How to Give a<br/>Convincing<br/><em>Elevator Pitch</em></h1>
    <p class="sub">Ada has five weeks to get one minute right. Build your pitch alongside hers.</p>
  </div>

  <div class="stage">
    <div class="floors"><span>28</span><span>29</span><span>30</span><span>31</span><span class="on">32</span></div>
    <div class="arrow"></div>

    <div class="watch"><div class="ring2"></div><b>0:60</b></div>

    <div class="bubble b1 ghost" style="left:-30px;top:580px"><p>x</p></div>
    <div class="bubble b1"><div class="who">Ada · floor 2 to 32</div><p>"I help savings groups track who's paid."</p></div>

    <div class="bubble b2"><p>"Tell me more."</p></div>

    <div class="chip" style="left:20px;top:300px;transform:rotate(-7deg)">One clear ask</div>

    <svg class="spark" style="left:640px;top:520px" width="54" height="54" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff"/></svg>
    <svg class="spark" style="left:240px;top:200px" width="40" height="40" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#F59E0B"/></svg>
  </div>
</body>
</html>
