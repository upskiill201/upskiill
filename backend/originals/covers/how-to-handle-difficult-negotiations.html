<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet" />
<style>
  /* Teyro Originals cover: How to Handle Difficult Negotiations. A still frame
     of Arjun's tactic log: the £28,000 counter crossed through, tactic stickers
     (flinch, deadline, good cop), and the signed £42,000. No Tey. */
  :root {
    --brand: #0172FD;
    --brand-dark: #0060D9;
    --brand-deep: #0050B3;
    --ink: #071233;
    --amber: #F59E0B;
    --amber-dark: #B45309;
    --green: #22C55E;
    --green-dark: #16A34A;
    --pink: #EC4899;
    --pink-dark: #9D174D;
    --white: #FFFFFF;
    --mist: #E8F1FF;
    --steel: #1B2A4A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--brand); overflow: hidden; position: relative; }

  .blob { position: absolute; border-radius: 50%; background: var(--brand-dark); }
  .ring { position: absolute; border-radius: 50%; border: 6px solid var(--white); }

  .copy { position: absolute; left: 100px; top: 130px; width: 760px; z-index: 5; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--white); color: var(--brand);
    font-weight: 800; font-size: 26px; letter-spacing: .08em; text-transform: uppercase;
    padding: 14px 26px; border-radius: 999px; box-shadow: 0 6px 0 var(--brand-deep);
  }
  .pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--amber); display: inline-block; }
  h1 { margin-top: 38px; color: var(--white); font-weight: 800; font-size: 92px; line-height: 1.0; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: var(--ink); background: var(--amber); padding: 0 18px 6px; border-radius: 26px; box-shadow: 0 8px 0 var(--amber-dark); display: inline-block; margin: 10px 0 6px; }
  .sub { margin-top: 36px; color: var(--mist); font-weight: 700; font-size: 32px; line-height: 1.3; width: 620px; }

  .stage { position: absolute; left: 920px; top: 100px; width: 620px; height: 820px; transform: rotate(-3deg); }
  .sheet { position: absolute; left: 20px; top: 60px; width: 580px; background: var(--steel); border-radius: 40px; padding: 36px 40px; box-shadow: 0 14px 0 #0B1630; }
  .sheet h2 { font-size: 24px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); font-weight: 800; }
  .line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px; color: var(--white); }
  .line span { font-size: 26px; font-weight: 700; opacity: .65; }
  .line b { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; }
  .line.cut b { text-decoration: line-through; text-decoration-thickness: 6px; text-decoration-color: var(--pink); opacity: .7; }
  .line.win b { color: var(--ink); background: var(--green); padding: 2px 18px; border-radius: 16px; box-shadow: 0 6px 0 var(--green-dark); }

  .tag { position: absolute; padding: 13px 22px; border-radius: 16px; font-weight: 800; font-size: 26px; white-space: nowrap; color: var(--ink); background: var(--white); box-shadow: 0 6px 0 var(--brand-deep); }
  .tag s { text-decoration-thickness: 4px; text-decoration-color: var(--pink); }
  .tag.pink { background: var(--pink); color: var(--white); box-shadow: 0 6px 0 var(--pink-dark); }

  .spark { position: absolute; }
</style>
</head>
<body>
  <div class="blob" style="width:820px;height:820px;right:-220px;top:-300px;opacity:.55"></div>
  <div class="blob" style="width:540px;height:540px;left:-220px;bottom:-280px;opacity:.45"></div>
  <div class="ring" style="width:150px;height:150px;left:780px;top:810px;opacity:.12"></div>
  <div class="ring" style="width:60px;height:60px;left:1520px;top:40px;opacity:.25"></div>

  <div class="copy">
    <span class="pill"><i></i>Teyro Original · Short course</span>
    <h1>How to Handle<br/><em>Difficult</em><br/>Negotiations</h1>
    <p class="sub">Arjun's biggest client plays every trick in the book. Stay calm and get a fair deal.</p>
  </div>

  <div class="stage">
    <div class="sheet">
      <h2>Arjun's deal sheet</h2>
      <div class="line"><span>Quoted</span><b>£48,000</b></div>
      <div class="line cut"><span>Their offer</span><b>£28,000</b></div>
      <div class="line win"><span>Signed</span><b>£42,000</b></div>
    </div>

    <div class="tag" style="left:-60px;top:500px;transform:rotate(-6deg)">Flinch? Noted.</div>
    <div class="tag pink" style="left:300px;top:560px;transform:rotate(5deg)">"Decide by Friday"</div>
    <div class="tag" style="left:40px;top:670px;transform:rotate(3deg)">Good cop, bad cop</div>

    <svg class="spark" style="left:580px;top:470px" width="54" height="54" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff"/></svg>
    <svg class="spark" style="left:0;top:20px" width="40" height="40" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#F59E0B"/></svg>
  </div>
</body>
</html>
