<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet" />
<style>
  /* Teyro Originals cover: Leadership for Beginners. A still frame of
     Lucía's first 90 days: a tear-off countdown at Day 90, her team of five
     around a "Team lead" badge, and the line that built the team. No Tey. */
  :root {
    --brand: #0172FD;
    --brand-dark: #0060D9;
    --brand-deep: #0050B3;
    --ink: #071233;
    --green: #22C55E;
    --green-dark: #15803D;
    --amber: #F59E0B;
    --amber-dark: #B45309;
    --pink: #EC4899;
    --pink-dark: #9D174D;
    --violet: #8B5CF6;
    --violet-dark: #5B21B6;
    --teal: #14B8A6;
    --teal-dark: #0F766E;
    --white: #FFFFFF;
    --mist: #E8F1FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--brand); overflow: hidden; position: relative; }

  .blob { position: absolute; border-radius: 50%; background: var(--brand-dark); }
  .ring { position: absolute; border-radius: 50%; border: 6px solid var(--white); }

  .copy { position: absolute; left: 100px; top: 130px; width: 720px; z-index: 5; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--white); color: var(--brand);
    font-weight: 800; font-size: 26px; letter-spacing: .08em; text-transform: uppercase;
    padding: 14px 26px; border-radius: 999px; box-shadow: 0 6px 0 var(--brand-deep);
  }
  .pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--green); display: inline-block; }
  h1 { margin-top: 40px; color: var(--white); font-weight: 800; font-size: 108px; line-height: 1.0; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: var(--white); background: var(--green); padding: 0 20px 8px; border-radius: 28px; box-shadow: 0 8px 0 var(--green-dark); display: inline-block; margin: 12px 0 6px; }
  .sub { margin-top: 38px; color: var(--mist); font-weight: 700; font-size: 32px; line-height: 1.3; width: 620px; }

  .stage { position: absolute; left: 870px; top: 70px; width: 700px; height: 880px; }

  /* Tear-off countdown */
  .cal { position: absolute; left: 190px; top: 40px; width: 320px; transform: rotate(4deg); }
  .cal .sheet { position: absolute; left: 0; width: 320px; height: 330px; border-radius: 34px; background: var(--white); }
  .cal .back1 { top: 22px; left: 14px; opacity: .35; }
  .cal .back2 { top: 11px; left: 7px; opacity: .6; }
  .cal .front { top: 0; box-shadow: 0 12px 0 var(--brand-deep); overflow: hidden; }
  .cal .top { height: 92px; background: var(--ink); display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 800; font-size: 34px; letter-spacing: .14em; text-transform: uppercase; }
  .cal .num { text-align: center; font-weight: 800; color: var(--ink); font-size: 170px; letter-spacing: -0.05em; line-height: 1; margin-top: 18px; }
  .cal .hole { position: absolute; top: -16px; width: 26px; height: 46px; border-radius: 13px; background: var(--steel, #1B2A4A); }

  /* The team */
  .team { position: absolute; left: 30px; top: 440px; width: 640px; height: 260px; }
  .face { position: absolute; width: 132px; height: 132px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 56px; color: var(--white); border: 8px solid var(--white); }
  .face span { position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 800; color: var(--white); letter-spacing: .04em; white-space: nowrap; }
  .lead { width: 176px; height: 176px; font-size: 76px; background: var(--green); box-shadow: 0 10px 0 var(--green-dark); }
  .badge { position: absolute; padding: 12px 22px; border-radius: 16px; font-weight: 800; font-size: 26px; color: var(--ink); background: var(--amber); box-shadow: 0 6px 0 var(--amber-dark); white-space: nowrap; }

  .bubble { position: absolute; padding: 26px 32px; font-weight: 800; color: var(--ink); background: var(--white); box-shadow: 0 12px 0 var(--brand-deep); border-radius: 40px 40px 10px 40px; }
  .bubble .who { font-size: 22px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; color: var(--brand); }
  .bubble p { font-size: 38px; line-height: 1.14; }

  .chip { position: absolute; padding: 13px 22px; border-radius: 18px; font-weight: 800; font-size: 27px; color: var(--white); white-space: nowrap; background: var(--pink); box-shadow: 0 6px 0 var(--pink-dark); }
  .spark { position: absolute; }
</style>
</head>
<body>
  <div class="blob" style="width:820px;height:820px;right:-240px;top:-320px;opacity:.55"></div>
  <div class="blob" style="width:560px;height:560px;left:-240px;bottom:-290px;opacity:.45"></div>
  <div class="ring" style="width:150px;height:150px;left:760px;top:820px;opacity:.12"></div>
  <div class="ring" style="width:60px;height:60px;left:1520px;top:40px;opacity:.25"></div>

  <div class="copy">
    <span class="pill"><i></i>Teyro Original · Short course</span>
    <h1>Leadership<br/>for <em>Beginners</em></h1>
    <p class="sub" style="width:640px">Lucía has 90 days to lead the team she sat in yesterday. Learn to lead with her.</p>
  </div>

  <div class="stage">
    <div class="cal">
      <div class="sheet back1"></div>
      <div class="sheet back2"></div>
      <div class="sheet front">
        <div class="top">Day</div>
        <div class="num">90</div>
      </div>
    </div>

    <div class="chip" style="left:0;top:120px;transform:rotate(-7deg)">Promoted!</div>

    <div class="team">
      <div class="face" style="left:0;top:70px;background:var(--pink)">M<span>Marta</span></div>
      <div class="face" style="left:120px;top:0;background:var(--violet)">D<span>Diego</span></div>
      <div class="face lead" style="left:232px;top:40px">L<span>Lucía</span></div>
      <div class="face" style="left:390px;top:0;background:var(--teal)">S<span>Sofía</span></div>
      <div class="face" style="left:508px;top:70px;background:var(--amber)">T<span>Tomás</span></div>
      <div class="badge" style="left:244px;top:-36px;transform:rotate(-4deg)">Team lead</div>
    </div>

    <div class="bubble" style="left:110px;top:700px;width:560px"><div class="who">Lucía · Week 3</div><p>"Thank you for telling me."</p></div>

    <svg class="spark" style="left:560px;top:60px" width="54" height="54" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff"/></svg>
    <svg class="spark" style="left:110px;top:330px" width="40" height="40" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#22C55E"/></svg>
  </div>
</body>
</html>
