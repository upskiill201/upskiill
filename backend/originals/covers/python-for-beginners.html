<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=block" rel="stylesheet" />
<style>
  /* Teyro Originals cover: Python for Beginners. A still frame of a
     motion-graphics scene: a line of Python is written, Run is pressed,
     the output appears and the checks go green. No Tey, no Python logo. */
  :root {
    --brand: #0172FD;
    --brand-dark: #0060D9;
    --brand-deep: #0050B3;
    --ink: #071233;
    --ink-2: #0E1B45;
    --purple: #9333EA;
    --indigo: #6352FF;
    --green: #22C55E;
    --green-dark: #16A34A;
    --amber: #F59E0B;
    --amber-dark: #B45309;
    --yellow: #FFD43B;
    --pink: #EC4899;
    --pink-dark: #9D174D;
    --white: #FFFFFF;
    --mist: #E8F1FF;
    --code-fg: #E6ECF8;
    --code-muted: #6B7A9C;
    --code-kw: #C4A6FF;
    --code-str: #7EE2A0;
    --code-num: #FFC979;
    --code-fn: #7FB6FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--brand); overflow: hidden; position: relative; }

  .blob { position: absolute; border-radius: 50%; background: var(--brand-dark); }
  .speed { position: absolute; height: 10px; border-radius: 999px; background: var(--white); transform: rotate(-18deg); transform-origin: left center; }
  .ring { position: absolute; border-radius: 50%; border: 6px solid var(--white); }

  .copy { position: absolute; left: 100px; top: 140px; width: 660px; z-index: 5; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--white); color: var(--purple);
    font-weight: 800; font-size: 26px; letter-spacing: .08em; text-transform: uppercase;
    padding: 14px 26px; border-radius: 999px; box-shadow: 0 6px 0 var(--brand-deep);
  }
  .pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--purple); display: inline-block; }
  h1 { margin-top: 40px; color: var(--white); font-weight: 800; font-size: 140px; line-height: .95; letter-spacing: -0.035em; }
  h1 em { font-style: normal; display: inline-block; margin-top: 16px; font-size: 76px; letter-spacing: -0.02em; color: var(--ink); background: var(--yellow); padding: 6px 22px 12px; border-radius: 24px; box-shadow: 0 8px 0 var(--amber-dark); }
  .sub { margin-top: 40px; color: var(--mist); font-weight: 700; font-size: 34px; line-height: 1.3; width: 600px; }

  .stage { position: absolute; left: 820px; top: 70px; width: 740px; height: 880px; transform: rotate(-4deg); }

  /* Editor */
  .editor {
    position: absolute; left: 40px; top: 60px; width: 620px; height: 330px;
    background: var(--ink); border-radius: 30px; box-shadow: 0 12px 0 #030a1f; overflow: hidden;
  }
  .bar { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 24px; background: var(--ink-2); }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .file { margin-left: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; color: var(--code-muted); }
  .code { padding: 26px 28px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 29px; line-height: 1.75; color: var(--code-fg); white-space: pre; }
  .ln { color: #34446B; margin-right: 22px; }
  .kw { color: var(--code-kw); } .fn { color: var(--code-fn); } .str { color: var(--code-str); } .num { color: var(--code-num); }
  .caret { display: inline-block; width: 4px; height: 34px; background: var(--white); vertical-align: -6px; margin-left: 2px; border-radius: 2px; }

  /* Run button being pressed */
  .run {
    position: absolute; left: 470px; top: 342px; z-index: 6;
    display: flex; align-items: center; gap: 12px;
    background: var(--green); color: var(--white); font-weight: 800; font-size: 30px; letter-spacing: .06em;
    padding: 16px 30px; border-radius: 20px; box-shadow: 0 4px 0 var(--green-dark); transform: translateY(4px);
  }
  .ripple { position: absolute; border-radius: 50%; border: 5px solid var(--white); }
  .cursor { position: absolute; left: 610px; top: 384px; width: 54px; z-index: 7; filter: drop-shadow(0 4px 0 rgba(0,0,0,.18)); }

  /* Output console */
  .output {
    position: absolute; left: 100px; top: 470px; width: 560px; height: 230px;
    background: var(--white); border-radius: 30px; box-shadow: 0 12px 0 var(--brand-deep); padding: 26px 32px;
  }
  .outHead { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: var(--green-dark); }
  .tick { width: 38px; height: 38px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 var(--green-dark); }
  .outText { margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 30px; line-height: 1.5; color: var(--ink); white-space: pre; }

  /* Flying Python keywords with motion trails */
  .chip { position: absolute; padding: 14px 24px; border-radius: 18px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 28px; color: var(--white); white-space: nowrap; }
  .ghost { opacity: .25; color: transparent !important; box-shadow: none !important; }
  .ghost2 { opacity: .12; color: transparent !important; box-shadow: none !important; }
  .c-if { background: var(--purple); box-shadow: 0 6px 0 #6B21A8; }
  .c-for { background: var(--pink); box-shadow: 0 6px 0 var(--pink-dark); }
  .c-def { background: var(--amber); box-shadow: 0 6px 0 var(--amber-dark); color: var(--ink); }
  .c-list { background: var(--indigo); box-shadow: 0 6px 0 #3F33B8; }

  /* Version + XP */
  .version { position: absolute; left: -10px; top: 0px; background: var(--yellow); color: var(--ink); font-weight: 800; font-size: 28px; padding: 12px 22px; border-radius: 18px; box-shadow: 0 6px 0 var(--amber-dark); transform: rotate(-6deg); z-index: 8; }
  .progress { position: absolute; left: 160px; top: 760px; width: 440px; height: 34px; border-radius: 999px; background: var(--brand-deep); box-shadow: inset 0 4px 0 rgba(0,0,0,.15); }
  .progress i { position: absolute; left: 6px; top: 6px; bottom: 6px; width: 70%; border-radius: 999px; background: var(--green); box-shadow: inset 0 -5px 0 var(--green-dark); }
  .progress i::after { content: ''; position: absolute; left: 14px; right: 14px; top: 4px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.45); }
  .xp { position: absolute; left: 560px; top: 724px; background: var(--white); color: var(--brand); font-weight: 800; font-size: 32px; padding: 14px 24px; border-radius: 22px; box-shadow: 0 7px 0 var(--brand-deep); transform: rotate(8deg); }
  .spark { position: absolute; }
</style>
</head>
<body>
  <div class="blob" style="width:820px;height:820px;right:-220px;top:-300px;opacity:.55"></div>
  <div class="blob" style="width:540px;height:540px;left:-220px;bottom:-280px;opacity:.45"></div>

  <div class="speed" style="left:-40px;top:930px;width:420px;opacity:.10"></div>
  <div class="speed" style="left:300px;top:965px;width:260px;opacity:.16"></div>
  <div class="speed" style="left:700px;top:110px;width:160px;opacity:.14"></div>
  <div class="speed" style="left:750px;top:150px;width:100px;opacity:.20"></div>
  <div class="speed" style="left:1380px;top:915px;width:260px;opacity:.12"></div>
  <div class="ring" style="width:150px;height:150px;left:700px;top:720px;opacity:.12"></div>
  <div class="ring" style="width:60px;height:60px;left:1510px;top:70px;opacity:.25"></div>

  <div class="copy">
    <span class="pill"><i></i>Teyro Original · Beginner</span>
    <h1>Python<br/><em>for Beginners</em></h1>
    <p class="sub">Write real code from your very first lesson, right on your phone.</p>
  </div>

  <div class="stage">
    <div class="version">v0.1</div>

    <div class="editor">
      <div class="bar">
        <span class="dot" style="background:#FF6B6B"></span>
        <span class="dot" style="background:#FFC94D"></span>
        <span class="dot" style="background:#4ADE80"></span>
        <span class="file">main.py</span>
      </div>
      <div class="code"><span class="ln">1</span><span class="fn">print</span>(<span class="str">"Hello, Ajo!"</span>)
<span class="ln">2</span><span class="fn">print</span>(<span class="str">"Pot:"</span>, <span class="num">10</span> * <span class="num">20000</span>)<span class="caret"></span></div>
    </div>

    <div class="ripple" style="left:575px;top:326px;width:100px;height:100px;opacity:.55"></div>
    <div class="ripple" style="left:545px;top:296px;width:160px;height:160px;opacity:.25"></div>
    <div class="run">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l13-7.5z"/></svg>
      RUN
    </div>
    <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-7 1.6L9 20z" fill="#071233" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>

    <div class="output">
      <div class="outHead">
        <span class="tick"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        Output
      </div>
      <div class="outText">Hello, Ajo!
Pot: 200000</div>
    </div>

    <div class="chip c-if ghost2" style="left:-150px;top:470px">if</div>
    <div class="chip c-if ghost" style="left:-112px;top:476px">if</div>
    <div class="chip c-if" style="left:-74px;top:482px;transform:rotate(-8deg)">if</div>

    <div class="chip c-for ghost2" style="left:-140px;top:640px">for</div>
    <div class="chip c-for ghost" style="left:-102px;top:634px">for</div>
    <div class="chip c-for" style="left:-64px;top:628px;transform:rotate(6deg)">for</div>

    <div class="chip c-def ghost2" style="left:700px;top:520px">def</div>
    <div class="chip c-def ghost" style="left:665px;top:530px">def</div>
    <div class="chip c-def" style="left:628px;top:540px;transform:rotate(-7deg)">def</div>

    <div class="chip c-list ghost2" style="left:690px;top:80px">[ ]</div>
    <div class="chip c-list ghost" style="left:660px;top:92px">[ ]</div>
    <div class="chip c-list" style="left:628px;top:104px;transform:rotate(9deg)">[ ]</div>

    <div class="progress"><i></i></div>
    <div class="xp">+20 XP</div>

    <svg class="spark" style="left:690px;top:-10px" width="54" height="54" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff"/></svg>
    <svg class="spark" style="left:60px;top:730px" width="40" height="40" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#FFD43B"/></svg>
    <svg class="spark" style="left:660px;top:830px" width="34" height="34" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff" opacity=".8"/></svg>
  </div>
</body>
</html>
