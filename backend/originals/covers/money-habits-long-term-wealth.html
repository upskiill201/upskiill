<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet" />
<style>
  /* Teyro Originals cover: Money Habits That Build Long-Term Wealth. Miracle's 40-year map and her dad's phone call. No Tey. */
  :root {
    --brand: #0172FD; --brand-dark: #0060D9; --brand-deep: #0050B3; --ink: #071233;
    --amber: #F59E0B; --amber-dark: #B45309; --green: #22C55E; --green-dark: #16A34A;
    --pink: #EC4899; --pink-dark: #9D174D; --white: #FFFFFF; --mist: #E8F1FF; --steel: #1B2A4A;
    --accent: var(--green); --accent-dark: var(--green-dark);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--brand); overflow: hidden; position: relative; }
  .blob { position: absolute; border-radius: 50%; background: var(--brand-dark); }
  .ring { position: absolute; border-radius: 50%; border: 6px solid var(--white); }
  .copy { position: absolute; left: 100px; top: 130px; width: 760px; z-index: 5; }
  .pill { display: inline-flex; align-items: center; gap: 12px; background: var(--white); color: var(--brand); font-weight: 800; font-size: 26px; letter-spacing: .08em; text-transform: uppercase; padding: 14px 26px; border-radius: 999px; box-shadow: 0 6px 0 var(--brand-deep); }
  .pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); display: inline-block; }
  h1 { margin-top: 38px; color: var(--white); font-weight: 800; line-height: 1.0; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: var(--ink); background: var(--accent); padding: 0 18px 6px; border-radius: 26px; box-shadow: 0 8px 0 var(--accent-dark); display: inline-block; margin: 10px 0 6px; }
  .sub { margin-top: 32px; color: var(--mist); font-weight: 700; font-size: 32px; line-height: 1.3; width: 640px; }
  .stage { position: absolute; left: 900px; top: 150px; width: 640px; height: 820px; transform: rotate(-3deg); }
  .card { position: absolute; left: 30px; top: 40px; width: 580px; background: var(--white); border-radius: 40px; padding: 36px 40px; box-shadow: 0 14px 0 var(--brand-deep); }
  .card h2 { font-size: 24px; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); font-weight: 800; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 3px dashed var(--mist); gap: 16px; }
  .row:last-child { border-bottom: none; }
  .row span { font-size: 28px; font-weight: 700; color: var(--ink); opacity: .6; }
  .row b { font-size: 30px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; background: var(--mist); padding: 4px 14px; border-radius: 14px; white-space: nowrap; }
  .row b.strike { background: var(--pink); color: var(--white); box-shadow: 0 5px 0 var(--pink-dark); }
  .row:last-child b:not(.strike) { background: var(--accent); box-shadow: 0 5px 0 var(--accent-dark); }
  .tick-row { display: flex; align-items: center; gap: 18px; padding: 16px 0; border-bottom: 3px dashed var(--mist); font-size: 30px; font-weight: 800; color: var(--ink); }
  .tick-row:last-child { border-bottom: none; }
  .tick-row i { width: 40px; height: 40px; border-radius: 12px; background: var(--green); box-shadow: 0 4px 0 var(--green-dark); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .tick-row i svg { width: 24px; height: 24px; }
  .bubble { position: absolute; left: -40px; width: 540px; padding: 26px 32px; font-weight: 800; border-radius: 36px 36px 36px 10px; background: var(--steel); color: var(--white); box-shadow: 0 12px 0 #0B1630; }
  .bubble .who { font-size: 20px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .bubble p { font-size: 34px; line-height: 1.16; }
  .stat { position: absolute; right: 30px; top: -72px; background: var(--accent); color: var(--ink); font-weight: 800; border-radius: 28px; padding: 16px 26px; box-shadow: 0 8px 0 var(--accent-dark); text-align: center; transform: rotate(6deg); }
  .stat b { display: block; font-size: 50px; line-height: 1; letter-spacing: -0.03em; }
  .stat span { font-size: 18px; letter-spacing: .1em; text-transform: uppercase; }
  .spark { position: absolute; }

  h1 { font-size: 88px; }
</style>
</head>
<body>
  <div class="blob" style="width:820px;height:820px;right:-220px;top:-300px;opacity:.55"></div>
  <div class="blob" style="width:540px;height:540px;left:-220px;bottom:-280px;opacity:.45"></div>
  <div class="ring" style="width:150px;height:150px;left:760px;top:800px;opacity:.12"></div>
  <div class="ring" style="width:60px;height:60px;left:1520px;top:40px;opacity:.25"></div>

  <div class="copy">
    <span class="pill"><i></i>Teyro Original · Short course</span>
    <h1>Money Habits<br/>That Build<br/><em>Wealth</em></h1>
    <p class="sub">The habits in your twenties decide your sixties.</p>
  </div>

  <div class="stage">
    <div class="card">
      <h2>Miracle's 40-year map</h2>
      <div class="row"><span>Saving</span><b>13% → 28%</b></div>
      <div class="row"><span>Net worth</span><b>₦2.3m → ₦6.4m</b></div>
      <div class="row"><span>Every raise</span><b>Half to future me</b></div>
    </div>
    <div class="stat"><b>40</b><span>year plan</span></div>
    <div class="bubble" style="top:420px"><div class="who">Dad · from Buea</div><p>"Don't wait for next year."</p></div>
    <svg class="spark" style="left:600px;top:380px" width="54" height="54" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff"/></svg>
    <svg class="spark" style="left:0px;top:10px" width="40" height="40" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#F59E0B"/></svg>
  </div>
</body>
</html>
