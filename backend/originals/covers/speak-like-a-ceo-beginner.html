<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet" />
<style>
  /* Teyro Originals cover: Speak Like a CEO. Lucía's talk card with the
     checks ticked, her opening line on stage, and the 300-seat Encuentro.
     No Tey. */
  :root {
    --brand: #0172FD;
    --brand-dark: #0060D9;
    --brand-deep: #0050B3;
    --ink: #071233;
    --amber: #F59E0B;
    --amber-dark: #B45309;
    --green: #22C55E;
    --green-dark: #16A34A;
    --pink: #EC4899;
    --pink-dark: #9D174D;
    --white: #FFFFFF;
    --mist: #E8F1FF;
    --steel: #1B2A4A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--brand); overflow: hidden; position: relative; }

  .blob { position: absolute; border-radius: 50%; background: var(--brand-dark); }
  .ring { position: absolute; border-radius: 50%; border: 6px solid var(--white); }

  .copy { position: absolute; left: 100px; top: 130px; width: 740px; z-index: 5; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--white); color: var(--brand);
    font-weight: 800; font-size: 26px; letter-spacing: .08em; text-transform: uppercase;
    padding: 14px 26px; border-radius: 999px; box-shadow: 0 6px 0 var(--brand-deep);
  }
  .pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--amber); display: inline-block; }
  h1 { margin-top: 38px; color: var(--white); font-weight: 800; font-size: 100px; line-height: 1.0; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: var(--ink); background: var(--amber); padding: 0 18px 6px; border-radius: 26px; box-shadow: 0 8px 0 var(--amber-dark); display: inline-block; margin: 10px 0 6px; }
  .sub { margin-top: 36px; color: var(--mist); font-weight: 700; font-size: 32px; line-height: 1.3; width: 620px; }

  .stage { position: absolute; left: 900px; top: 90px; width: 640px; height: 840px; transform: rotate(-3deg); }
  .card { position: absolute; left: 30px; top: 40px; width: 580px; background: var(--white); border-radius: 40px; padding: 36px 40px; box-shadow: 0 14px 0 var(--brand-deep); }
  .card h2 { font-size: 24px; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); font-weight: 800; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 3px dashed var(--mist); }
  .row:last-child { border-bottom: none; }
  .row span { font-size: 28px; font-weight: 700; color: var(--ink); opacity: .6; }
  .row b { font-size: 36px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
  .row.goal b { background: var(--amber); padding: 4px 16px; border-radius: 14px; box-shadow: 0 5px 0 var(--amber-dark); }
  .row.secret b { filter: blur(9px); }
  .lock { font-size: 20px; font-weight: 800; color: var(--pink); letter-spacing: .08em; text-transform: uppercase; margin-left: 10px; }

  .bubble { position: absolute; padding: 26px 32px; font-weight: 800; border-radius: 36px 36px 36px 10px; }
  .b1 { left: -40px; top: 520px; width: 520px; background: var(--steel); color: var(--white); box-shadow: 0 12px 0 #0B1630; }
  .b1 .who { font-size: 20px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); margin-bottom: 8px; }
  .b1 p { font-size: 34px; line-height: 1.16; }
  .b2 { left: 200px; top: 720px; background: var(--green); color: var(--white); border-radius: 30px 30px 10px 30px; box-shadow: 0 10px 0 var(--green-dark); padding: 20px 30px; }
  .b2 p { font-size: 34px; white-space: nowrap; }

  .spark { position: absolute; }
  .tick-row { display: flex; align-items: center; gap: 18px; padding: 16px 0; border-bottom: 3px dashed var(--mist); font-size: 30px; font-weight: 800; color: var(--ink); }
  .tick-row:last-child { border-bottom: none; }
  .tick-row i { width: 40px; height: 40px; border-radius: 12px; background: var(--green); box-shadow: 0 4px 0 var(--green-dark); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .tick-row i svg { width: 24px; height: 24px; }
  .stat { position: absolute; left: 420px; top: -10px; background: var(--amber); color: var(--ink); font-weight: 800; border-radius: 28px; padding: 16px 26px; box-shadow: 0 8px 0 var(--amber-dark); text-align: center; transform: rotate(6deg); }
  .stat b { display: block; font-size: 52px; line-height: 1; letter-spacing: -0.03em; }
  .stat span { font-size: 18px; letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="blob" style="width:820px;height:820px;right:-220px;top:-300px;opacity:.55"></div>
  <div class="blob" style="width:540px;height:540px;left:-220px;bottom:-280px;opacity:.45"></div>
  <div class="ring" style="width:150px;height:150px;left:760px;top:800px;opacity:.12"></div>
  <div class="ring" style="width:60px;height:60px;left:1520px;top:40px;opacity:.25"></div>

  <div class="copy">
    <span class="pill"><i></i>Teyro Original · Short course</span>
    <h1>Speak Like<br/><em>a CEO</em></h1>
    <p class="sub">Clear, calm and confident, from a quick update to a room of 300.</p>
  </div>

  <div class="stage">
    <div class="card">
      <h2>Lucía's talk card</h2>
      <div class="tick-row"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Headline first</div>
      <div class="tick-row"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Three points, then stop</div>
      <div class="tick-row"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Pause, eyes on people</div>
    </div>
    <div class="stat"><b>300</b><span>people</span></div>

    <div class="bubble b1" style="top:430px"><div class="who">Lucía · on stage</div><p>"We listened, and it worked."</p></div>

    <svg class="spark" style="left:600px;top:390px" width="54" height="54" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff"/></svg>
    <svg class="spark" style="left:0;top:10px" width="40" height="40" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#F59E0B"/></svg>
  </div>
</body>
</html>
