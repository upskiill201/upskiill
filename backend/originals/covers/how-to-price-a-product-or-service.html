<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet" />
<style>
  /* Teyro Originals cover: How to Price a Product or Service. A still frame of
     WashDay's price card: three options, an old crossed-out price, and a
     margin chip. No Tey. */
  :root {
    --brand: #0172FD;
    --brand-dark: #0060D9;
    --brand-deep: #0050B3;
    --ink: #071233;
    --amber: #F59E0B;
    --amber-dark: #B45309;
    --green: #22C55E;
    --green-dark: #16A34A;
    --pink: #EC4899;
    --pink-dark: #9D174D;
    --white: #FFFFFF;
    --mist: #E8F1FF;
    --steel: #1B2A4A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--brand); overflow: hidden; position: relative; }

  .blob { position: absolute; border-radius: 50%; background: var(--brand-dark); }
  .ring { position: absolute; border-radius: 50%; border: 6px solid var(--white); }

  .copy { position: absolute; left: 100px; top: 130px; width: 720px; z-index: 5; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--white); color: var(--brand);
    font-weight: 800; font-size: 26px; letter-spacing: .08em; text-transform: uppercase;
    padding: 14px 26px; border-radius: 999px; box-shadow: 0 6px 0 var(--brand-deep);
  }
  .pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--amber); display: inline-block; }
  h1 { margin-top: 38px; color: var(--white); font-weight: 800; font-size: 100px; line-height: 1.0; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: var(--ink); background: var(--amber); padding: 0 18px 6px; border-radius: 26px; box-shadow: 0 8px 0 var(--amber-dark); display: inline-block; margin: 10px 0 6px; }
  .sub { margin-top: 36px; color: var(--mist); font-weight: 700; font-size: 32px; line-height: 1.3; width: 620px; }

  .stage { position: absolute; left: 900px; top: 100px; width: 640px; height: 820px; transform: rotate(-3deg); }
  .card { position: absolute; left: 30px; top: 60px; width: 580px; background: var(--white); border-radius: 40px; padding: 38px 40px 34px; box-shadow: 0 14px 0 var(--brand-deep); }
  .card h2 { font-size: 24px; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); font-weight: 800; }
  .opt { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; padding: 22px 26px; border-radius: 24px; background: var(--mist); }
  .opt span { font-size: 34px; font-weight: 800; color: var(--ink); }
  .opt b { font-size: 40px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
  .opt b small { font-size: 20px; opacity: .55; margin-left: 6px; }
  .opt.hot { background: var(--amber); box-shadow: 0 6px 0 var(--amber-dark); transform: scale(1.04); }
  .old { margin-top: 26px; font-size: 26px; font-weight: 700; color: var(--ink); opacity: .55; }
  .old s { text-decoration-thickness: 4px; text-decoration-color: var(--pink); }

  .tag { position: absolute; left: 380px; top: 0; width: 200px; height: 96px; background: var(--steel); color: var(--white); border-radius: 20px 48px 48px 20px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; box-shadow: 0 8px 0 #0B1630; transform: rotate(10deg); }
  .tag::before { content: ''; position: absolute; left: 18px; width: 18px; height: 18px; border-radius: 50%; background: var(--brand); }

  .chip { position: absolute; padding: 14px 24px; border-radius: 18px; font-weight: 800; font-size: 30px; color: var(--white); white-space: nowrap; background: var(--green); box-shadow: 0 6px 0 var(--green-dark); }
  .spark { position: absolute; }
</style>
</head>
<body>
  <div class="blob" style="width:820px;height:820px;right:-220px;top:-300px;opacity:.55"></div>
  <div class="blob" style="width:540px;height:540px;left:-220px;bottom:-280px;opacity:.45"></div>
  <div class="ring" style="width:150px;height:150px;left:760px;top:800px;opacity:.12"></div>
  <div class="ring" style="width:60px;height:60px;left:1520px;top:40px;opacity:.25"></div>

  <div class="copy">
    <span class="pill"><i></i>Teyro Original · Short course</span>
    <h1>How to Price a<br/>Product or<br/><em>Service</em></h1>
    <p class="sub">Clinton is busy and broke. Charge what it's worth and keep your customers.</p>
  </div>

  <div class="stage">
    <div class="card">
      <h2>WashDay price card</h2>
      <div class="opt"><span>Saver</span><b>1,400<small>FCFA</small></b></div>
      <div class="opt hot"><span>Standard</span><b>1,800<small>FCFA</small></b></div>
      <div class="opt"><span>Express</span><b>2,500<small>FCFA</small></b></div>
      <div class="old">Was <s>1,500 for everything</s></div>
    </div>
    <div class="tag">FCFA</div>

    <div class="chip" style="left:-40px;top:640px;transform:rotate(-6deg)">Margin 375 &rarr; 675</div>
    <div class="chip" style="left:330px;top:700px;transform:rotate(5deg);background:var(--pink);box-shadow:0 6px 0 var(--pink-dark)">No hidden fees</div>

    <svg class="spark" style="left:600px;top:500px" width="54" height="54" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff"/></svg>
    <svg class="spark" style="left:0;top:30px" width="40" height="40" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#F59E0B"/></svg>
  </div>
</body>
</html>
