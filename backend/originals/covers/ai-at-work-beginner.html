<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet" />
<style>
  /* Teyro Originals cover: AI at Work (Beginner). A still frame of a
     motion-graphics scene: a vague prompt becomes a useful answer. */
  :root {
    --brand: #0172FD;
    --brand-dark: #0060D9;
    --brand-deep: #0050B3;
    --ink: #071233;
    --purple: #9333EA;
    --indigo: #6352FF;
    --green: #22C55E;
    --green-dark: #16A34A;
    --amber: #F59E0B;
    --amber-dark: #B45309;
    --pink: #EC4899;
    --white: #FFFFFF;
    --mist: #E8F1FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--brand); overflow: hidden; position: relative; }

  /* Depth: big soft circles and diagonal speed lines. */
  .blob { position: absolute; border-radius: 50%; background: var(--brand-dark); }
  .speed { position: absolute; height: 10px; border-radius: 999px; background: var(--white); transform: rotate(-18deg); transform-origin: left center; }
  .ring { position: absolute; border-radius: 50%; border: 6px solid var(--white); }

  .copy { position: absolute; left: 100px; top: 140px; width: 640px; z-index: 5; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--white); color: var(--purple);
    font-weight: 800; font-size: 26px; letter-spacing: .08em; text-transform: uppercase;
    padding: 14px 26px; border-radius: 999px; box-shadow: 0 6px 0 var(--brand-deep);
  }
  .pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--purple); display: inline-block; }
  h1 { margin-top: 44px; color: var(--white); font-weight: 800; font-size: 150px; line-height: .95; letter-spacing: -0.035em; }
  .sub { margin-top: 34px; color: var(--mist); font-weight: 700; font-size: 38px; line-height: 1.3; width: 600px; }

  /* The stage on the right, tilted like a camera move. */
  .stage { position: absolute; left: 790px; top: 60px; width: 760px; height: 900px; transform: rotate(-4deg); }

  /* Prompt bar. */
  .prompt {
    position: absolute; left: 30px; top: 70px; width: 640px; height: 104px;
    background: var(--white); border-radius: 30px; box-shadow: 0 10px 0 var(--brand-deep);
    display: flex; align-items: center; padding: 0 22px 0 34px; gap: 18px;
  }
  .prompt .txt { flex: 1; font-weight: 700; font-size: 30px; color: var(--ink); white-space: nowrap; overflow: hidden; }
  .prompt .txt b { color: var(--indigo); }
  .caret { display: inline-block; width: 4px; height: 36px; background: var(--brand); vertical-align: -6px; margin-left: 4px; border-radius: 2px; }
  .send {
    width: 66px; height: 66px; border-radius: 20px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 var(--brand-deep);
  }
  /* Cursor clicking Send, with ripples. */
  .cursor { position: absolute; left: 630px; top: 150px; width: 56px; z-index: 6; filter: drop-shadow(0 4px 0 rgba(0,0,0,.18)); }
  .ripple { position: absolute; border-radius: 50%; border: 5px solid var(--white); }

  /* Flow arrow: the request becomes an answer. */
  .flow { position: absolute; left: 110px; top: 196px; width: 200px; height: 150px; }

  /* Answer card, building itself. */
  .answer {
    position: absolute; left: 110px; top: 300px; width: 600px; height: 380px;
    background: var(--white); border-radius: 34px; box-shadow: 0 12px 0 var(--brand-deep);
    padding: 34px 38px;
  }
  .answer .head { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 24px; letter-spacing: .1em; text-transform: uppercase; color: var(--green-dark); }
  .check { width: 40px; height: 40px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 var(--green-dark); }
  .line { height: 22px; border-radius: 999px; background: #E3EAF6; margin-top: 22px; }
  .line.hi { background: var(--mist); position: relative; overflow: hidden; }
  .line.hi::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 62%; background: var(--brand); border-radius: 999px; }
  .typing { display: flex; gap: 10px; margin-top: 30px; }
  .typing span { width: 16px; height: 16px; border-radius: 50%; background: var(--indigo); }
  .typing span:nth-child(2) { opacity: .6; }
  .typing span:nth-child(3) { opacity: .3; }

  /* Context chips flying in, with motion trails. */
  .chip {
    position: absolute; padding: 14px 24px; border-radius: 18px; font-weight: 800; font-size: 28px;
    color: var(--white); white-space: nowrap;
  }
  .ghost { opacity: .25; color: transparent !important; }
  .ghost2 { opacity: .12; color: transparent !important; }
  .who { background: var(--purple); box-shadow: 0 6px 0 #6B21A8; }
  .what { background: var(--pink); box-shadow: 0 6px 0 #9D174D; }
  .why { background: var(--green); box-shadow: 0 6px 0 var(--green-dark); }
  .how { background: var(--amber); box-shadow: 0 6px 0 var(--amber-dark); color: var(--ink); }

  /* Progress bar + XP burst. */
  .progress { position: absolute; left: 150px; top: 740px; width: 470px; height: 34px; border-radius: 999px; background: var(--brand-deep); box-shadow: inset 0 4px 0 rgba(0,0,0,.15); }
  .progress i { position: absolute; left: 6px; top: 6px; bottom: 6px; width: 78%; border-radius: 999px; background: var(--green); box-shadow: inset 0 -5px 0 var(--green-dark); }
  .progress i::after { content: ''; position: absolute; left: 14px; right: 14px; top: 4px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.45); }
  .xp { position: absolute; left: 560px; top: 700px; background: var(--amber); color: var(--ink); font-weight: 800; font-size: 32px; padding: 14px 24px; border-radius: 22px; box-shadow: 0 7px 0 var(--amber-dark); transform: rotate(8deg); }

  .spark { position: absolute; }
</style>
</head>
<body>
  <div class="blob" style="width:820px;height:820px;right:-220px;top:-300px;opacity:.55"></div>
  <div class="blob" style="width:540px;height:540px;left:-220px;bottom:-280px;opacity:.45"></div>

  <!-- Speed lines -->
  <div class="speed" style="left:-40px;top:780px;width:420px;opacity:.10"></div>
  <div class="speed" style="left:60px;top:840px;width:260px;opacity:.16"></div>
  <div class="speed" style="left:640px;top:120px;width:180px;opacity:.14"></div>
  <div class="speed" style="left:700px;top:160px;width:110px;opacity:.20"></div>
  <div class="speed" style="left:1380px;top:900px;width:260px;opacity:.12"></div>
  <div class="ring" style="width:150px;height:150px;left:620px;top:690px;opacity:.12"></div>
  <div class="ring" style="width:60px;height:60px;left:1500px;top:90px;opacity:.25"></div>

  <div class="copy">
    <span class="pill"><i></i>Teyro Original · Beginner</span>
    <h1>AI at<br/>Work</h1>
    <p class="sub">Get genuinely useful answers from AI, every working day.</p>
  </div>

  <div class="stage">
    <!-- Prompt bar with typing caret -->
    <div class="prompt">
      <div class="txt">Write a 5-line update for <b>Lucía</b><span class="caret"></span></div>
      <div class="send">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </div>
    </div>

    <!-- Click ripples + cursor on Send -->
    <div class="ripple" style="left:582px;top:84px;width:76px;height:76px;opacity:.55"></div>
    <div class="ripple" style="left:556px;top:58px;width:128px;height:128px;opacity:.28"></div>
    <div class="ripple" style="left:530px;top:32px;width:180px;height:180px;opacity:.12"></div>
    <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-7 1.6L9 20z" fill="#071233" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>

    <!-- Flow arrow from prompt to answer -->
    <svg class="flow" viewBox="0 0 200 150" fill="none">
      <path d="M30 6 C 30 70, 110 60, 120 128" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 22" opacity=".85"/>
      <path d="M100 118 L120 138 L140 112" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    </svg>

    <!-- Answer card building itself -->
    <div class="answer">
      <div class="head">
        <span class="check"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        Useful answer
      </div>
      <div class="line" style="width:92%"></div>
      <div class="line hi" style="width:100%"></div>
      <div class="line" style="width:78%"></div>
      <div class="line" style="width:86%"></div>
      <div class="typing"><span></span><span></span><span></span></div>
    </div>

    <!-- Context chips flying in (with trails) -->
    <div class="chip who ghost2" style="left:-150px;top:268px">Who</div>
    <div class="chip who ghost" style="left:-110px;top:274px">Who</div>
    <div class="chip who" style="left:-70px;top:280px;transform:rotate(-8deg)">Who</div>

    <div class="chip what ghost2" style="left:690px;top:300px">What</div>
    <div class="chip what ghost" style="left:655px;top:312px">What</div>
    <div class="chip what" style="left:615px;top:324px;transform:rotate(9deg)">What</div>

    <div class="chip why ghost2" style="left:-130px;top:560px">Why</div>
    <div class="chip why ghost" style="left:-95px;top:556px">Why</div>
    <div class="chip why" style="left:-58px;top:552px;transform:rotate(6deg)">Why</div>

    <div class="chip how ghost2" style="left:695px;top:600px">How</div>
    <div class="chip how ghost" style="left:662px;top:592px">How</div>
    <div class="chip how" style="left:628px;top:584px;transform:rotate(-7deg)">How</div>

    <!-- Progress and XP burst -->
    <div class="progress"><i></i></div>
    <div class="xp">+20 XP</div>

    <!-- Sparkles -->
    <svg class="spark" style="left:690px;top:20px" width="54" height="54" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff"/></svg>
    <svg class="spark" style="left:40px;top:690px" width="40" height="40" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#F59E0B"/></svg>
    <svg class="spark" style="left:640px;top:820px" width="34" height="34" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#fff" opacity=".8"/></svg>
  </div>
</body>
</html>
