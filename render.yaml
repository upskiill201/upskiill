services:

  # ─── STAGING BACKEND ────────────────────────────────────────────────────────
  # Repurposed from the original upskiill-backend service.
  # URL: https://upskiill-backend.onrender.com
  # Watches the `staging` branch. Auto-deploys on every push to staging.
  - type: web
    name: teyro-backend-staging
    env: node
    region: oregon
    plan: free
    branch: staging
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: staging
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false   # set in Render dashboard → existing Supabase project
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false   # set to your staging Vercel URL, e.g. https://teyro-git-staging.vercel.app
      # Where Google Drive's consent screen sends the admin back to (the
      # course importer). Unset, it falls back to ALLOWED_ORIGINS.
      - key: FRONTEND_URL
        sync: false   # the staging Vercel URL
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false   # sk_test_ key for staging
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MESOMB_APP_KEY
        sync: false
      - key: MESOMB_ACCESS_KEY
        sync: false
      - key: MESOMB_SECRET_KEY
        sync: false
      - key: EARNINGS_ENC_KEY
        sync: false
      # ── Tey intelligence layer ──────────────────────────────────────────
      # The scheduler runs an in-process cron AND accepts an external tick
      # (POST /tey/scheduler/tick), because a spun-down free-plan instance runs
      # no cron at all. See backend/src/tey/README.md.
      - key: TEY_SCHEDULER_ENABLED
        value: "true"
      # Dry-run: revalidate and record what WOULD be sent, then send nothing.
      # Flip to "true" only once a delivery channel ships.
      - key: TEY_DELIVERY_ENABLED
        value: "false"
      - key: TEY_SCHEDULER_SECRET
        sync: false   # shared secret for the external tick caller
      # Web Push (VAPID). Generate with: npx web-push generate-vapid-keys
      # The PRIVATE key never leaves the server; the public one is served to
      # browsers at GET /tey/push/public-key.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@teyro.app
      # AI layer. Off by default — providers are configured at /admin and their
      # keys are encrypted at rest with EARNINGS_ENC_KEY, never in env.
      - key: TEY_AI_ENABLED
        value: "false"
      - key: TEY_AI_DAILY_BUDGET_USD
        value: "2"
      - key: TEY_AI_MAX_CALLS_PER_USER_DAY
        value: "20"
      - key: TEY_AI_MAX_PROACTIVE_DAY
        value: "200"

  # ─── PRODUCTION BACKEND ─────────────────────────────────────────────────────
  # New service created for production.
  # URL: https://teyro-backend.onrender.com
  # Watches the `main` branch. Auto-deploy is DISABLED — triggered via GitHub Actions deploy hook.
  - type: web
    name: teyro-backend
    env: node
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false   # set to new teyro-production Supabase connection string
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false   # DIFFERENT from staging — generate a new strong secret
      - key: ALLOWED_ORIGINS
        value: https://teyro.app
      # Where Google Drive's consent screen sends the admin back to.
      - key: FRONTEND_URL
        value: https://teyro.app
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false   # sk_live_ key for production (sk_test_ until ready)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false   # new webhook secret from Stripe production endpoint
      - key: MESOMB_APP_KEY
        sync: false
      - key: MESOMB_ACCESS_KEY
        sync: false
      - key: MESOMB_SECRET_KEY
        sync: false
      - key: EARNINGS_ENC_KEY
        sync: false
      # ── Tey intelligence layer ──────────────────────────────────────────
      # The scheduler runs an in-process cron AND accepts an external tick
      # (POST /tey/scheduler/tick), because a spun-down free-plan instance runs
      # no cron at all. See backend/src/tey/README.md.
      - key: TEY_SCHEDULER_ENABLED
        value: "true"
      # Dry-run: revalidate and record what WOULD be sent, then send nothing.
      # Flip to "true" only once a delivery channel ships.
      - key: TEY_DELIVERY_ENABLED
        value: "false"
      - key: TEY_SCHEDULER_SECRET
        sync: false   # shared secret for the external tick caller
      # Web Push (VAPID). Generate with: npx web-push generate-vapid-keys
      # The PRIVATE key never leaves the server; the public one is served to
      # browsers at GET /tey/push/public-key.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@teyro.app
      # AI layer. Off by default — providers are configured at /admin and their
      # keys are encrypted at rest with EARNINGS_ENC_KEY, never in env.
      - key: TEY_AI_ENABLED
        value: "false"
      - key: TEY_AI_DAILY_BUDGET_USD
        value: "2"
      - key: TEY_AI_MAX_CALLS_PER_USER_DAY
        value: "20"
      - key: TEY_AI_MAX_PROACTIVE_DAY
        value: "200"
